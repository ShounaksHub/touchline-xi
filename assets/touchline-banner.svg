<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a13"/>
      <stop offset="50%" stop-color="#11251c"/>
      <stop offset="100%" stop-color="#07120d"/>
    </linearGradient>
    <radialGradient id="stadiumGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a6345" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#143525" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4c9"/>
      <stop offset="40%" stop-color="#e8bf56"/>
      <stop offset="70%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#cf982e"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; letter-spacing: 1.5px; fill: #b8cfc0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .pitch-line { stroke: #26543b; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#stadiumGlow)"/>
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#2a4d38" stroke-width="1.5"/>

  <!-- Tactical Pitch Grid Lines (Background Geometry) -->
  <g opacity="0.6">
    <!-- Pitch Outline -->
    <rect x="70" y="45" width="1060" height="330" rx="6" fill="none" stroke="#1d422e" stroke-width="2"/>
    <!-- Halfway Line -->
    <line x1="600" y1="45" x2="600" y2="375" stroke="#1d422e" stroke-width="2"/>
    <!-- Center Circle -->
    <circle cx="600" cy="210" r="75" fill="none" stroke="#1d422e" stroke-width="2"/>
    <circle cx="600" cy="210" r="4" fill="#38ef7d"/>
    <!-- Left Penalty Box -->
    <rect x="70" y="110" width="140" height="200" fill="none" stroke="#1d422e" stroke-width="1.5"/>
    <rect x="70" y="150" width="50" height="120" fill="none" stroke="#1d422e" stroke-width="1.5"/>
    <circle cx="170" cy="210" r="3" fill="#1d422e"/>
    <!-- Right Penalty Box -->
    <rect x="990" y="110" width="140" height="200" fill="none" stroke="#1d422e" stroke-width="1.5"/>
    <rect x="1080" y="150" width="50" height="120" fill="none" stroke="#1d422e" stroke-width="1.5"/>
    <circle cx="1030" cy="210" r="3" fill="#1d422e"/>
  </g>

  <!-- Tactical Arrows & Attack Vectors -->
  <path d="M 460 210 Q 530 160 670 140 T 820 180" fill="none" stroke="#38ef7d" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  <polygon points="825,180 812,173 816,183" fill="#38ef7d" opacity="0.8"/>
  
  <path d="M 460 280 Q 600 320 780 290" fill="none" stroke="#e8bf56" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <polygon points="785,289 772,284 774,295" fill="#e8bf56" opacity="0.7"/>

  <!-- Glowing Radar Player Dots -->
  <!-- Home Team (Cyan Glow) -->
  <circle cx="200" cy="210" r="8" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="340" cy="110" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="320" cy="180" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="320" cy="240" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="340" cy="310" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="480" cy="150" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="450" cy="210" r="8" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="480" cy="270" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="680" cy="110" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="700" cy="210" r="8" fill="#38ef7d" filter="url(#neonGlow)"/>
  <circle cx="680" cy="310" r="7" fill="#38ef7d" filter="url(#neonGlow)"/>

  <!-- Away Team (Ruby Dots) -->
  <circle cx="1000" cy="210" r="8" fill="#ff4d4d" opacity="0.8"/>
  <circle cx="870" cy="130" r="7" fill="#ff4d4d" opacity="0.8"/>
  <circle cx="850" cy="190" r="7" fill="#ff4d4d" opacity="0.8"/>
  <circle cx="850" cy="230" r="7" fill="#ff4d4d" opacity="0.8"/>
  <circle cx="870" cy="290" r="7" fill="#ff4d4d" opacity="0.8"/>
  <circle cx="740" cy="160" r="7" fill="#ff4d4d" opacity="0.8"/>
  <circle cx="730" cy="260" r="7" fill="#ff4d4d" opacity="0.8"/>

  <!-- Football (Glowing White Match Ball) -->
  <circle cx="692" cy="208" r="5" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Center Typography Container (Dark Glass Pill) -->
  <rect x="250" y="80" width="700" height="230" rx="16" fill="#06120bd9" stroke="#254d35" stroke-width="1.5" backdrop-filter="blur(10px)"/>

  <!-- Header Badge Pill -->
  <rect x="470" y="102" width="260" height="26" rx="13" fill="#132c1e" stroke="#2b6b45" stroke-width="1"/>
  <text x="600" y="119" text-anchor="middle" fill="#52de97" class="mono">⚡ SIMULATION ENGINE 02</text>

  <!-- Big Brand Title -->
  <text x="600" y="185" text-anchor="middle" fill="#ffffff" class="title" font-size="52">
    TOUCHLINE <tspan fill="#38ef7d">/</tspan> <tspan fill="url(#goldText)">XI</tspan>
  </text>

  <!-- Punchy Subtitle -->
  <text x="600" y="222" text-anchor="middle" class="sub" font-size="16">
    The Deterministic, Zero-Dependency Football Management Studio
  </text>
  <text x="600" y="246" text-anchor="middle" class="sub" font-size="13" fill="#88aa94">
    Built for the Beautiful Game • Pure Vanilla JS &amp; Canvas 2D • Offline First
  </text>

  <!-- Bottom Feature Badges Chips -->
  <g transform="translate(285, 268)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="145" height="26" rx="6" fill="#102619" stroke="#1e4d30"/>
    <text x="72" y="17" text-anchor="middle" fill="#e0e8e2" class="mono" font-size="11">⚽ 2,750+ Players</text>

    <!-- Chip 2 -->
    <rect x="155" y="0" width="145" height="26" rx="6" fill="#102619" stroke="#1e4d30"/>
    <text x="227" y="17" text-anchor="middle" fill="#e0e8e2" class="mono" font-size="11">🌍 132 Teams</text>

    <!-- Chip 3 -->
    <rect x="310" y="0" width="170" height="26" rx="6" fill="#102619" stroke="#1e4d30"/>
    <text x="395" y="17" text-anchor="middle" fill="#e0e8e2" class="mono" font-size="11">📦 0 npm Dependencies</text>

    <!-- Chip 4 -->
    <rect x="490" y="0" width="140" height="26" rx="6" fill="#102619" stroke="#1e4d30"/>
    <text x="560" y="17" text-anchor="middle" fill="#e0e8e2" class="mono" font-size="11">🏆 Knockout Cups</text>
  </g>

</svg>
