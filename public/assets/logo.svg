<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232B" />
      <stop offset="40%" stop-color="#14181F" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="35%" stop-color="#DFCA96" />
      <stop offset="70%" stop-color="#D4B77B" />
      <stop offset="100%" stop-color="#9C7C40" />
    </linearGradient>

    <!-- Subtle Pitch Accent Gradient -->
    <linearGradient id="pitchLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B77B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4B77B" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow/Shadow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Luxury Shield Shadow & Body -->
  <g filter="url(#subtleGlow)">
    <!-- Base Shield -->
    <path d="M256 28 L436 84 C436 244 366 384 256 476 C146 384 76 244 76 84 Z"
          fill="url(#shieldDarkGrad)"
          stroke="url(#champagneGold)"
          stroke-width="10"
          stroke-linejoin="round" />

    <!-- Inner Shield Inset Border -->
    <path d="M256 46 L418 97 C418 238 356 366 256 450 C156 366 94 238 94 97 Z"
          fill="none"
          stroke="#D4B77B"
          stroke-opacity="0.35"
          stroke-width="2.5" />
  </g>

  <!-- Subtle Pitch Lines in Shield Background -->
  <g opacity="0.35">
    <!-- Center Circle -->
    <circle cx="256" cy="275" r="74" fill="none" stroke="url(#pitchLineGrad)" stroke-width="3" stroke-dasharray="6,4" />
    <circle cx="256" cy="275" r="5" fill="#D4B77B" />
    <!-- Halfway Line -->
    <line x1="102" y1="275" x2="410" y2="275" stroke="url(#pitchLineGrad)" stroke-width="3" />
    <!-- Touchline arcs -->
    <path d="M186 94 C186 130 326 130 326 94" fill="none" stroke="url(#pitchLineGrad)" stroke-width="2" />
    <path d="M206 430 C206 390 306 390 306 430" fill="none" stroke="url(#pitchLineGrad)" stroke-width="2" />
  </g>

  <!-- Top Athletic Star -->
  <g transform="translate(256, 76)">
    <polygon points="0,-14 4.3,-4.3 14.7,-4.3 6.3,2 9.5,12 0,5.7 -9.5,12 -6.3,2 -14.7,-4.3 -4.3,-4.3"
             fill="url(#champagneGold)" />
  </g>

  <!-- Wordmark: TOUCHLINE -->
  <text x="256" y="115"
        text-anchor="middle"
        font-family="'Barlow Condensed', 'Inter', -apple-system, sans-serif"
        font-size="21"
        font-weight="800"
        letter-spacing="9"
        fill="#E4CA97">TOUCHLINE</text>

  <!-- Subtitle rule -->
  <line x1="160" y1="128" x2="352" y2="128" stroke="url(#champagneGold)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Central "XI" Athletic Monogram -->
  <!-- X: Crossing diagonal bars with chamfered sports ends -->
  <g id="monogramXI">
    <!-- 'X' Glyph -->
    <path d="M156 168 L196 168 L244 246 L292 168 L332 168 L264 274 L336 384 L296 384 L244 302 L192 384 L152 384 L224 274 Z"
          display="none" /> <!-- fallback shape -->

    <!-- Custom Crisp X -->
    <polygon points="148,168 190,168 238,248 220,277 166,192 148,192" fill="#9C7C40" opacity="0.6" />
    <path d="M152 165 L200 165 L242 238 L284 165 L332 165 L268 270 L336 378 L288 378 L242 302 L196 378 L148 378 L216 270 Z"
          fill="url(#champagneGold)"
          stroke="#0B0D11"
          stroke-width="3"
          stroke-linejoin="miter" />

    <!-- 'I' Glyph: Classic athletic pillar with top and bottom crossbars -->
    <path d="M346 165 L394 165 L394 195 L378 195 L378 348 L394 348 L394 378 L346 378 L346 348 L362 348 L362 195 L346 195 Z"
          fill="url(#champagneGold)"
          stroke="#0B0D11"
          stroke-width="3"
          stroke-linejoin="miter" />
  </g>

  <!-- Bottom Accent Ribbon / Est. 2026 -->
  <g transform="translate(256, 420)">
    <text text-anchor="middle"
          font-family="'Barlow Condensed', 'Inter', -apple-system, sans-serif"
          font-size="14"
          font-weight="700"
          letter-spacing="5"
          fill="#A9ACB5">STUDIO EDITION</text>
  </g>
</svg>
